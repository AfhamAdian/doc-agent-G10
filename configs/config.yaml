# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cpu  # auto | cpu | cuda; auto uses CUDA when available, otherwise CPU

# Development-only subset build. Set enabled: false for the graded/full corpus build.
# Pilot output is isolated so it cannot overwrite data/index.
pilot:
  enabled: true
  books: ["physics"]
  max_pages_per_book: 20
  index_path: "data/index-pilot"

ingest:
  raw_dir: "data/raw"
  rendered_dir: "data/interim/pages"
  heldout_dir: "grading_kit/heldout_pages"
  dpi: 300
  exclude_heldout: true
preprocess: {deskew: false, denoise: false, binarize: false}
enhance:   {enabled: false, model: "none", type: "none"}
layout:
  model: "doclayout_yolo"
  repo_id: "Armaggheddon/yolo11-document-layout"
  checkpoint_file: "yolo11n_doc_layout.pt"
  score_thr: 0.5
ocr:
  model: "easyocr"
  languages: ["bn", "en"]
  paragraph: true
  cache_dir: "data/interim/ocr"
embed:
  model: "intfloat/multilingual-e5-large"
  dim: 1024
  batch_size_gpu: 16
  batch_size_cpu: 4
index:     {type: "flat", path: "data/index", chunk_size: 500, chunk_overlap: 50}  # FAISS IndexFlatIP; semantic chunking on sentence boundaries (E4)
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
