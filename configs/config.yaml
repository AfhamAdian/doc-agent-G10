# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

enhance:   {enabled: true,  model: "unet_small", type: "diffusion"}   # or "vae" / "none"
layout:    {model: "Armaggheddon/yolo11-document-layout", score_thr: 0.5}  # DocLayNet 11-class YOLO11
ocr:       {model: "easyocr"}                                               # EasyOCR bn+en, chosen for Bangla-Latin code-mixed accuracy
embed:     {model: "intfloat/multilingual-e5-large", dim: 1024}             # multilingual-e5-large, best on cross-lingual & Banglish queries (E23)
index:     {type: "flat", path: "data/index", chunk_size: 500, chunk_overlap: 50}  # FAISS IndexFlatIP; semantic chunking on sentence boundaries (E4)
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
